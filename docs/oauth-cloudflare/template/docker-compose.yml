version: '3.8'

services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-oauth-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Auth0 Configuration
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
      
      # Server Configuration
      - SERVER_URL=${SERVER_URL:-http://localhost:8000}
      - SERVER_HOST=${SERVER_HOST:-0.0.0.0}
      - SERVER_PORT=${SERVER_PORT:-8000}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      
      # ConnectWise API Configuration
      - CW_COMPANY_ID=${CW_COMPANY_ID}
      - CW_PUBLIC_KEY=${CW_PUBLIC_KEY}
      - CW_PRIVATE_KEY=${CW_PRIVATE_KEY}
      - CW_CLIENT_ID=${CW_CLIENT_ID}
      - CW_API_URL=${CW_API_URL:-https://api-na.myconnectwise.net/v4_6_release/apis/3.0}
    volumes:
      - ./app:/app
      - mcp-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mcp-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: mcp-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      mcp-server:
        condition: service_healthy
    networks:
      - mcp-network

volumes:
  mcp-data:

networks:
  mcp-network:
    driver: bridge
