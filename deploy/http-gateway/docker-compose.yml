services:
  mcp-gateway:
    build:
      context: ..
      dockerfile: http-gateway/Dockerfile
    container_name: connectwise-mcp-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MCP_STATIC_TOKEN: ${MCP_STATIC_TOKEN}
      SERVER_URL: ${SERVER_URL:-http://localhost:8000}
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-${SERVER_URL:-http://localhost:8000}}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CONNECTWISE_API_URL: ${CONNECTWISE_API_URL}
      CONNECTWISE_COMPANY_ID: ${CONNECTWISE_COMPANY_ID}
      CONNECTWISE_PUBLIC_KEY: ${CONNECTWISE_PUBLIC_KEY}
      CONNECTWISE_PRIVATE_KEY: ${CONNECTWISE_PRIVATE_KEY}
      CONNECTWISE_AUTH_PREFIX: ${CONNECTWISE_AUTH_PREFIX}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_AUDIENCE: ${AZURE_AUDIENCE:-}
      AZURE_SCOPES: ${AZURE_SCOPES:-openid profile email}

  cloudflared:
    image: cloudflare/cloudflared:latest@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    container_name: connectwise-mcp-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      mcp-gateway:
        condition: service_started
