name: legacy-oauth-ci

on:
  workflow_dispatch:
  schedule:
    - cron: "43 6 * * 1"
  pull_request:
    paths:
      - "deploy/**"
      - ".github/dependabot.yml"
      - ".github/workflows/legacy-oauth-ci.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: legacy-oauth-ci-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            deploy/http-gateway/requirements-ci.lock
            deploy/http-gateway/requirements.lock
            deploy/cwm-mcp/requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.11.0
          cache: npm
          cache-dependency-path: deploy/cwm-mcp/package-lock.json
      - name: Install hash-locked CI tools
        run: >-
          python -m pip install --require-hashes
          -r deploy/http-gateway/requirements-ci.lock
      - name: Verify rollback dependency locks are current
        run: |
          uv pip compile deploy/http-gateway/requirements-ci.in --python-version 3.12 --generate-hashes --no-emit-index-url --output-file deploy/http-gateway/requirements-ci.lock
          uv pip compile deploy/http-gateway/requirements.txt deploy/cwm-mcp/requirements.txt --python-version 3.12 --generate-hashes --no-emit-index-url --output-file deploy/http-gateway/requirements.lock
          git diff --exit-code -- deploy/http-gateway/requirements-ci.lock deploy/http-gateway/requirements.lock
      - name: Install gateway dependencies
        run: >-
          python -m pip install --require-hashes
          -r deploy/http-gateway/requirements.lock
      - name: Compile legacy rollback code
        run: >-
          python -m compileall -q
          deploy/http-gateway/app
          deploy/http-gateway/tests
          deploy/cwm-mcp
      - name: Validate rollback image smoke script
        run: bash -n deploy/http-gateway/tests/smoke_rollback_image.sh
      - name: Run core Python checks
        run: >-
          ruff check --select E4,E7,E9,F
          deploy/http-gateway/app/main.py
          deploy/http-gateway/tests
      - name: Run legacy OAuth security tests
        run: python -m pytest -q deploy/http-gateway/tests
      - name: Audit Python rollback dependencies
        run: |
          pip-audit -r deploy/http-gateway/requirements-ci.lock
          pip-audit -r deploy/http-gateway/requirements.lock
          pip-audit -r deploy/cwm-mcp/requirements.txt
      - name: Verify legacy Node dependencies
        run: |
          npm ci --prefix deploy/cwm-mcp
          npm audit --prefix deploy/cwm-mcp --audit-level=moderate
      - name: Seed ignored build-context canaries
        run: |
          printf '%s\n' build-context-canary > deploy/cwm-mcp/.env
          printf '%s\n' build-context-canary > deploy/cwm-mcp/credentials.json
          printf '%s\n' build-context-canary > deploy/cwm-mcp/api_gateway/debug-backup.py
          printf '%s\n' build-context-canary > deploy/http-gateway/local-credentials.json
          printf '%s\n' build-context-canary > deploy/http-gateway/app/debug-backup.py
      - name: Verify canaries are absent from the Docker build context
        run: |
          for canary in \
            cwm-mcp/.env \
            cwm-mcp/credentials.json \
            cwm-mcp/api_gateway/debug-backup.py \
            http-gateway/local-credentials.json \
            http-gateway/app/debug-backup.py
          do
            if printf 'FROM scratch\nCOPY %s /canary\n' "$canary" | docker build --file - deploy; then
              printf 'Build-context canary unexpectedly available: %s\n' "$canary" >&2
              exit 1
            fi
          done
      - name: Validate rollback compose configuration and secret isolation
        env:
          MCP_STATIC_TOKEN: compose-canary-mcp-static-token
          SERVER_URL: compose-canary-server-url
          MCP_RESOURCE_URL: compose-canary-mcp-resource-url
          JWT_SECRET_KEY: compose-canary-jwt-secret-key
          CONNECTWISE_API_URL: compose-canary-connectwise-api-url
          CONNECTWISE_COMPANY_ID: compose-canary-connectwise-company-id
          CONNECTWISE_PUBLIC_KEY: compose-canary-connectwise-public-key
          CONNECTWISE_PRIVATE_KEY: compose-canary-connectwise-private-key
          CONNECTWISE_AUTH_PREFIX: compose-canary-connectwise-auth-prefix
          AZURE_TENANT_ID: compose-canary-azure-tenant-id
          AZURE_CLIENT_ID: compose-canary-azure-client-id
          AZURE_CLIENT_SECRET: compose-canary-azure-client-secret
          AZURE_AUDIENCE: compose-canary-azure-audience
          AZURE_SCOPES: compose-canary-azure-scopes
          CLOUDFLARE_TUNNEL_TOKEN: compose-canary-cloudflare-tunnel-token
        run: |
          cp deploy/http-gateway/.env.example deploy/http-gateway/.env
          docker compose --env-file deploy/http-gateway/.env --file deploy/http-gateway/docker-compose.yml config --format json > /tmp/rollback-compose.json
          python deploy/http-gateway/tests/verify_compose_secret_isolation.py /tmp/rollback-compose.json --verify-canaries
          cloudflared_image="$(python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["services"]["cloudflared"]["image"])' /tmp/rollback-compose.json)"
          docker pull "$cloudflared_image"
          docker run --rm --cap-drop ALL --security-opt no-new-privileges:true "$cloudflared_image" --version
      - name: Build rollback image
        run: >-
          docker build --tag connectwise-legacy-rollback-ci
          --file deploy/http-gateway/Dockerfile deploy
      - name: Scan rollback image for fixable severe vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: connectwise-legacy-rollback-ci
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate rollback image CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: connectwise-legacy-rollback-ci
          format: cyclonedx
          output: connectwise-legacy-rollback-image.cdx.json
          scanners: vuln
          vuln-type: os,library
      - name: Verify allowlisted rollback image contents
        run: >-
          docker run --rm --entrypoint sh connectwise-legacy-rollback-ci
          -c '! grep -R -F -q build-context-canary /app
          && test ! -e /app/mcp-server/.env
          && test ! -e /app/mcp-server/credentials.json
          && test ! -e /app/mcp-server/api_gateway/debug-backup.py
          && test -f /app/mcp-server/api_gateway/server.py
          && test -f /app/mcp-server/api_gateway/api_db_utils.py
          && test -f /app/mcp-server/api_gateway/fast_memory_db.py
          && test -f /app/mcp-server/api_gateway/connectwise_api.db
          && test -f /app/gateway/main.py'
      - name: Package the verified rollback image
        id: rollback-image
        shell: bash
        run: |
          set -euo pipefail
          archive=connectwise-legacy-rollback-image.tar.gz
          manifest=connectwise-legacy-rollback-image.json
          checksum=connectwise-legacy-rollback-image.sha256
          sbom=connectwise-legacy-rollback-image.cdx.json
          image_id=$(docker image inspect --format '{{.Id}}' connectwise-legacy-rollback-ci)
          docker save connectwise-legacy-rollback-ci | gzip -n -9 > "$archive"
          archive_sha256=$(sha256sum "$archive" | cut -d ' ' -f 1)
          sbom_sha256=$(sha256sum "$sbom" | cut -d ' ' -f 1)
          printf '%s  %s\n' "$archive_sha256" "$archive" > "$checksum"
          printf '{"schemaVersion":2,"releaseCommit":"%s","workflowRunId":"%s","imageRepository":"connectwise-legacy-rollback-ci","imageId":"%s","archive":"%s","archiveSha256":"%s","sbom":"%s","sbomSha256":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$image_id" "$archive" "$archive_sha256" "$sbom" "$sbom_sha256" > "$manifest"
      - name: Verify packaged rollback artifact bindings and checksum
        run: >-
          python deploy/http-gateway/tests/verify_rollback_artifact.py
          . "$GITHUB_SHA" "$GITHUB_RUN_ID"
      - name: Reload the verified rollback image
        shell: bash
        run: |
          set -euo pipefail
          image_id=$(python -c 'import json; print(json.load(open("connectwise-legacy-rollback-image.json", encoding="utf-8"))["imageId"])')
          docker image rm connectwise-legacy-rollback-ci
          gzip -dc connectwise-legacy-rollback-image.tar.gz | docker load
          test "$(docker image inspect --format '{{.Id}}' connectwise-legacy-rollback-ci)" = "$image_id"
      - name: Smoke-test packaged rollback image startup and auth boundary
        run: bash deploy/http-gateway/tests/smoke_rollback_image.sh
      - name: Retain the verified rollback image
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: legacy-rollback-image-${{ github.sha }}
          path: |
            connectwise-legacy-rollback-image.tar.gz
            connectwise-legacy-rollback-image.sha256
            connectwise-legacy-rollback-image.json
            connectwise-legacy-rollback-image.cdx.json
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          retention-days: 90

  attest:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the verified rollback artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: legacy-rollback-image-${{ github.sha }}
          path: .
      - name: Attest the verified rollback artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            connectwise-legacy-rollback-image.tar.gz
            connectwise-legacy-rollback-image.sha256
            connectwise-legacy-rollback-image.json
            connectwise-legacy-rollback-image.cdx.json
